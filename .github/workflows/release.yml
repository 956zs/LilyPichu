name: Release

on:
  [workflow_dispatch, push]

jobs:
  build_css:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source Git branch
        uses: actions/checkout@v2
        with:
          ref: main
          fetch-depth: 10
          submodules: true
      
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      # Same build as `npm run build`; the sass action only knew old Sass
      - name: Compile CSS from SCSS files
        run: |
          npm install --no-package-lock
          npm run build
          mkdir -vp /tmp/LilyPichu/stuff
          cp dist/overlay.css /tmp/LilyPichu/stuff/overlay.css
          cp dist/main.css /tmp/LilyPichu/main.css

      - name: Checkout destination Git branch
        uses: actions/checkout@v2
        with:
            ref: debug
            fetch-depth: 1

      - name: Move CSS to destination Git branch
        run: |
          mkdir -p ./stuff
          mv /tmp/LilyPichu/stuff/overlay.css ./stuff/overlay.css
          mv /tmp/LilyPichu/main.css ./main.css

      - name: Add and Commit changes
        uses: EndBug/add-and-commit@v9 # You can change this to use a specific version.
        with:
        
          # The message for the commit.
          # Default: 'Commit from GitHub Actions (name of the workflow)'
          message: 'Created release'
